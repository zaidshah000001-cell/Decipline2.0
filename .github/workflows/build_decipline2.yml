name: Build Decipline2.0 APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get dependencies & Analyze SMS Engine
        working-directory: budget
        run: |
          flutter pub get
          flutter analyze lib/sms_ingestion
      - name: Build Decipline2.0 Release APK
        working-directory: budget
        run: flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Decipline2.0-release-apk
          path: budget/build/app/outputs/flutter-apk/app-release.apk
